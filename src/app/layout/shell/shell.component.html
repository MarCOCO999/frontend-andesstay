<div class="shell">
  <header class="topbar">
    <div class="brand">AndesStay</div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/reservations" routerLinkActive="active">Reservas</a>
      @if (currentUser.hasAnyRole('Admin', 'Operador')) {
        <a routerLink="/catalog" routerLinkActive="active">Catálogo</a>
      }
      @if (currentUser.hasRole('Admin')) {
        <a routerLink="/reports" routerLinkActive="active">Reportería</a>
      }
      @if (currentUser.hasAnyRole('Admin', 'Auditor')) {
        <a routerLink="/audit" routerLinkActive="active">Auditoría</a>
      }
    </nav>
    <div class="user-info">
      <div class="user-name">{{ currentUser.displayName }}</div>
      <div class="user-roles">{{ currentUser.roles.join(', ') }}</div>
      <button type="button" (click)="currentUser.logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
